# =========================================================================
# AI Dispatcher МЧС — dispatch rules (externalized; edit without code changes).
#
# Every coefficient the algorithm uses lives here. Add a new incident type by
# adding an entry under `incident_types` — no code change required. Capability
# and status codes reference the catalog rows (Capability.code /
# AvailabilityStatus.code) created in the data model.
# =========================================================================
version: "1"

# ------------------------------------------------------------------ scoring --
scoring:
  weights:            # relative importance of each score component
    distance: 0.5
    readiness: 0.2
    capability_match: 0.2
    arrival_time: 0.1   # used only when an arrival estimate is available
  readiness_scores:   # 0..1 sub-score by availability state
    deployable: 1.0
    operational: 0.5
    other: 0.0
  max_distance_meters: 50000.0   # distance sub-score decays linearly to 0 here
  confidence:
    high_threshold: 0.85
    medium_threshold: 0.5

# --------------------------------------------------------------- exclusions --
exclusions:
  require_active: true
  require_operational: true
  require_deployable: true
  excluded_status_codes:
    - maintenance
    - out_of_service
    - busy
    - reserved

# ------------------------------------------------------------ incident types --
incident_types:
  fire:
    code: fire
    name: Пожар
    priority: 1
    resource_categories: [vehicle, personnel]
    required_capabilities:
      - {code: fire_suppression, min_quantity: 2, label: Пожаротушение}
      - {code: water_supply, min_quantity: 1, label: Водоснабжение}
    minimum_units: 2
    recommended_units: 4
    reserve_units: 2
    search_radius_meters: 30000.0
    candidate_limit: 100

  forest_fire:
    code: forest_fire
    name: Лесной пожар
    priority: 1
    resource_categories: [vehicle, personnel]
