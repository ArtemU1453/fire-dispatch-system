[project]
name = "ai-dispatcher-mchs"
version = "0.1.0"
description = "AI Dispatcher МЧС — industrial FastAPI backend scaffold"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra -q"
filterwarnings = [
    # Benign asyncpg teardown artifact when the best-effort geocoding-log write
    # touches the shared engine across pytest's per-test event loops.
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["backend"]
# Alembic writes the versioned migration files; they are generated artefacts and
# not linted (the hand-written env.py and the initial migration still are).
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP046/UP047: keep explicit `Generic[T]` base classes instead of PEP 695
# `class Foo[T]` syntax — clearer for the layered generics here and more
# predictable with Pydantic v2 generic models.
# UP042: keep `(str, enum.Enum)` rather than `StrEnum`; the value-based
# serialization is relied on across schemas and the enum is already committed
# in a migration.
ignore = ["UP046", "UP047", "UP042"]
