# Alembic configuration.
#
# The database URL is intentionally NOT hard-coded here; it is injected at
# runtime from application settings in ``migrations/env.py`` so there is a single
# source of truth for configuration (DRY).

[alembic]
script_location = migrations
prepend_sys_path = backend
path_separator = os
timezone = UTC

# Template used to generate migration file names (timestamp + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

# Logging configuration for Alembic's own output.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
