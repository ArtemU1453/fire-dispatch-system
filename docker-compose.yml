# =========================================================================
# AI Dispatcher МЧС — local development stack.
# Brings up PostgreSQL and the FastAPI backend. Migrations run automatically
# before the API server starts.
# =========================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: dispatcher-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatcher}
      POSTGRES_DB: ${POSTGRES_DB:-dispatcher}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatcher} -d ${POSTGRES_DB:-dispatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatcher-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reachable as "db".
      POSTGRES_HOST: db
    ports:
      - "${PORT:-8000}:8000"
    # Apply migrations, then launch the API server.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
